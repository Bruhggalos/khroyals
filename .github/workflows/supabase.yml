name: Supabase

# Applies new database migrations (supabase/migrations) to the live project and
# redeploys the Edge Functions on every push to main that changes them.
# One-time setup: Settings → Secrets and variables → Actions → New repository
# secret SUPABASE_ACCESS_TOKEN (a personal access token, supabase.com → Account →
# Access Tokens). The project comes from app.json.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/supabase_setup.mjs'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

# One deploy at a time, never cancelled halfway through a migration.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks as the APK build: a migration that fails the DB tests never reaches the live project.
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the top of .github/workflows/supabase.yml)."
            exit 1
          fi
          node scripts/supabase_setup.mjs --deploy
