<title>Royals Connect Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — group rail + feed + settings drawer; collapses to one column on phones */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --ink:#1D1630; --muted:#6A6380; --line:#E4DEEF;
  --royal:#4B2A7B; --royal-soft:#EEE7F8; --gold:#E3A800; --gold-soft:#FFF4D6;
  --ok:#0F7A4E; --warn:#A35A00; --bad:#B42318;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F1D; --surface:#1D1729; --ink:#EEE9F7; --muted:#A49CB8; --line:#322A44;
  --royal:#B79BE6; --royal-soft:#2A2140; --gold:#F2C443; --gold-soft:#3A3010;
  --ok:#4CC38A; --warn:#F0A44A; --bad:#F2776B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1729; --ink:#EEE9F7; --muted:#A49CB8; --line:#322A44;
  --royal:#B79BE6; --royal-soft:#2A2140; --gold:#F2C443; --gold-soft:#3A3010;
  --ok:#4CC38A; --warn:#F0A44A; --bad:#F2776B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto 14px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.top h1 span{color:var(--gold)}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.as{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:6px}
.g{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;width:100%}
.g:hover{background:var(--surface)}
.g.on{background:var(--surface);border-color:var(--line)}
.gi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.g b{display:block;font-weight:600;font-size:14px}
.g small{color:var(--muted);font-size:12px}
.new{background:var(--royal);color:var(--surface);border:0;border-radius:10px;padding:10px;font-weight:700}
.main{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden}
.head{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head h2{font-size:22px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--royal-soft);color:var(--royal)}
.pill.gold{background:var(--gold-soft);color:var(--warn)}
.pill.bad{background:var(--bad);color:var(--surface)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.feed{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.post{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.post.pending{border-style:dashed;border-color:var(--warn)}
.post.chat{border:0;padding:0 0 0 4px}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
.who img,.av{width:26px;height:26px;border-radius:50%;background:var(--royal-soft);display:grid;place-items:center;font-size:12px}
.who b{font-weight:600}.who span{color:var(--muted)}
.post h3{font-size:16px;font-family:var(--body);font-weight:700}
.post p{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);align-items:center}
.link{background:none;border:0;padding:0;color:var(--royal);font-weight:600}
.mod{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.mod .ok{color:var(--ok)}.mod .no{color:var(--bad)}
.reps{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.poll{display:flex;flex-direction:column;gap:4px}
.bar{position:relative;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--royal-soft);z-index:0}
.bar span{position:relative}
.comp{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:center}
.row > :first-child{flex:1;min-width:0}
.send{background:var(--royal);color:var(--surface);border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.lock{color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw}
/* settings drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 40px #0003}
.drawer h2{font-size:20px;font-weight:800}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sec h3{font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px}
.seg button.on{background:var(--royal);border-color:var(--royal);color:var(--surface)}
.perm{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:8px;align-items:center;font-size:14px}
.tg{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.tg input{width:20px;height:20px;accent-color:var(--royal);flex:none}
.lockbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lockbox.on{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .g{width:auto;flex:none}.g small{display:none}
  .new{flex:none}
  .feed{max-height:none}
}
@media (prefers-reduced-motion:no-preference){.g,.seg button{transition:background .15s}}
</style>

<div class="top">
  <div><h1>Royals <span>Connect</span></h1><p>Clickable prototype with sample data. Switch people to see what each one can do.</p></div>
  <label class="as" for="who"><span class="lbl">Viewing as</span><select id="who"></select></label>
</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Groups"></nav>
  <section class="main" id="main"></section>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Group settings"></aside>
<div class="toast" id="toast" hidden></div>

const NOW = new Date();
let me = 'u-eng', cur = 'g-eng-p3', openReplies = new Set(), anon = false;

const RANK = {owner:0,moderator:1,member:2,subscriber:3};
const AUD = {nobody:-1,owners:0,moderators:1,members:2,subscribers:3};
const PRESETS = DB.presets;
const MODE = {chat:['Group Chat','Live conversation, like GroupMe.'],forum:['Discussion Board','Threads with replies and votes, like Reddit.'],
  broadcast:['Announcements','Staff post, everyone subscribes. Read-only by default.'],qa:['Q&A','Members ask, staff answer. Questions can be screened.']};
const PERM_LABELS = {viewContent:'Read posts',post:'Create posts',comment:'Reply',react:'React & vote',askQuestion:'Ask questions',answerQuestion:'Answer questions',
  attachFiles:'Attach files',createPolls:'Create polls',pin:'Pin posts',seeMemberList:'See members',directMessageMembers:'DM members',mentionEveryone:'@everyone'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const user = id => DB.users.find(u => u.id === id);
const group = id => DB.groups.find(g => g.id === id);
const mship = (g, u) => DB.memberships.find(m => m.groupId === g && m.userId === u) || null;
const isStaff = u => ['admin','teacher','staff'].includes(u.schoolRole);
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

/* ---- permission engine (same rules as src/comms/permissions.ts) ---- */
function role(gid){
  const u=user(me), g=group(gid), m=mship(gid,me);
  if(u.schoolRole==='admin') return 'owner';
  if(m) return m.role;
  return ['public','school'].includes(g.settings.visibility) ? 'subscriber' : null;
}
function quiet(g, r){
  const q=g.settings.quietHours; if(!q||!q.appliesTo.includes(r)) return false;
  const n=NOW.getHours()*60+NOW.getMinutes(), [a,b]=[q.start,q.end].map(t=>t.split(':').reduce((h,m)=>h*60+ +m));
  return a<=b ? n>=a&&n<b : n>=a||n<b;
}
function can(gid, action){
  const g=group(gid), s=g.settings, r=role(gid), m=mship(gid,me);
  if(r===null) return {ok:false, why:'You are not a member of this group.'};
  if(RANK[r] > AUD[s.permissions[action]]) return {ok:false, why: s.permissions[action]==='nobody' ? 'Nobody can do this in this group.' : `Only ${s.permissions[action]} can do this here.`};
  const mod = RANK[r] <= 1, write=['post','comment','askQuestion','answerQuestion','react','createPolls','attachFiles'].includes(action);
  if(write && !mod){
    if(s.locked) return {ok:false, why: s.lockReason || 'This group is locked.'};
    if(m && m.canPost===false && action!=='react') return {ok:false, why:'Posting is turned off for you in this group.'};
    if(m && m.mutedUntil && new Date(m.mutedUntil)>NOW && action!=='react') return {ok:false, why:'You are muted in this group until '+new Date(m.mutedUntil).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})+'.'};
    if(action!=='react' && quiet(g,r)) return {ok:false, why:`Quiet hours are on (${s.quietHours.start}–${s.quietHours.end}).`};
    if(action==='post' && s.requirePostApproval) return {ok:true, review:true};
    if(action==='askQuestion' && s.requireQuestionApproval) return {ok:true, review:true};
  }
  return {ok:true};
}
const isMod = gid => { const r=role(gid); return r!==null && RANK[r]<=1; };
const isOwner = gid => role(gid)==='owner';

/* ---- rendering ---- */
function renderWho(){
  const order=['admin','teacher','staff','student','parent'];
  $('#who').innerHTML = [...DB.users].sort((a,b)=>order.indexOf(a.schoolRole)-order.indexOf(b.schoolRole))
    .map(u=>`<option value="${u.id}" ${u.id===me?'selected':''}>${esc(u.firstName+' '+u.lastName)} · ${u.schoolRole}${u.grade?' (gr '+u.grade+')':''}</option>`).join('');
}
function visibleGroups(){
  return DB.groups.filter(g => { const r=role(g.id); return r!==null && (g.settings.visibility!=='hidden' || mship(g.id,me) || user(me).schoolRole==='admin'); });
}
function renderRail(){
  const gs=visibleGroups();
  if(!gs.find(g=>g.id===cur)) cur = gs[0]?.id;
  $('#rail').innerHTML = gs.map(g=>`<button class="g ${g.id===cur?'on':''}" data-g="${g.id}">
      <span class="gi" style="background:color-mix(in srgb, ${g.color} 22%, transparent)">${g.icon}</span>
      <span><b>${esc(g.name)}${g.settings.locked?' 🔒':''}</b><small>${MODE[g.settings.mode][0]} · ${mship(g.id,me)?.role || role(g.id)}</small></span></button>`).join('')
    + (isStaff(user(me)) ? `<button class="new" id="newg">+ New group</button>` : '');
}
function author(id, anonymous){
  const u = id && user(id);
  if(!u || anonymous) return `<div class="who"><span class="av">?</span><b>Anonymous</b></div>`;
  return `<div class="who"><img alt="" src="${u.avatar}"><b>${esc(u.firstName+' '+u.lastName)}</b><span>${u.schoolRole}</span></div>`;
}
function ago(t){ const m=Math.round((NOW-new Date(t))/60000); if(m<0) return 'scheduled'; if(m<60) return m+'m ago'; if(m<1440) return Math.round(m/60)+'h ago'; return Math.round(m/1440)+'d ago'; }
function postHTML(p, g){
  const mod=isMod(g.id), chat=g.settings.mode==='chat' && p.kind==='message';
  const reps=DB.comments.filter(c=>c.postId===p.id && c.status==='published');
  const open=openReplies.has(p.id);
  const poll = p.poll ? (()=>{ const tot=p.poll.options.reduce((a,o)=>a+o.votes.length,0)||1;
    return `<div class="poll"><b>${esc(p.poll.question)}</b>${p.poll.options.map(o=>`<button class="bar link" data-vote="${p.id}|${o.id}" style="text-align:left;color:var(--ink)"><i style="width:${o.votes.length/tot*100}%"></i><span>${esc(o.label)} · ${o.votes.length}${o.votes.includes(me)?' ✓':''}</span></button>`).join('')}</div>`; })() : '';
  const reply = can(g.id,'comment'), react=can(g.id,'react');
  return `<article class="post ${p.status==='pending'?'pending':''} ${chat?'chat':''}">
    <div class="meta" style="justify-content:space-between">${author(p.authorId,p.anonymous)}<span>${p.pinned?'📌 ':''}${ago(p.scheduledFor||p.createdAt)}</span></div>
    ${p.status!=='published'?`<div class="pills"><span class="pill gold">${p.status==='pending'?'Waiting for approval':p.status}</span></div>`:''}
    ${p.title?`<h3>${esc(p.title)}</h3>`:''}${p.body?`<p>${esc(p.body)}</p>`:''}
    ${p.attachments.filter(a=>a.type==='image').map(a=>`<img alt="" src="${a.url}" style="border-radius:10px;aspect-ratio:16/9;object-fit:cover;width:100%">`).join('')}
    ${poll}
    ${chat ? '' : `<div class="meta">
      ${g.settings.mode==='forum'?`<button class="link" data-up="${p.id}" ${react.ok?'':'disabled title="'+esc(react.why)+'"'}>▲ ${p.score}</button>`:''}
      ${Object.entries(p.reactions).map(([e,ids])=>`<span>${e} ${ids.length}</span>`).join('')}
      ${react.ok?`<button class="link" data-like="${p.id}">👍 React</button>`:''}
      <button class="link" data-rep="${p.id}">${open?'Hide replies':'Replies'} (${reps.length})</button>
      ${p.commentsLocked?'<span>Replies closed</span>':''}</div>`}
    ${mod?`<div class="mod">${p.status==='pending'?`<button class="link ok" data-m="approve|${p.id}">Approve</button><button class="link no" data-m="reject|${p.id}">Reject</button>`:''}
      <button class="link" data-m="pin|${p.id}">${p.pinned?'Unpin':'Pin'}</button>
      ${chat?'':`<button class="link" data-m="lock|${p.id}">${p.commentsLocked?'Reopen replies':'Close replies'}</button>`}
      <button class="link no" data-m="remove|${p.id}">Remove</button></div>`:''}
    ${open?`<div class="reps">${reps.map(c=>`<div>${author(c.authorId)}<p style="margin:4px 0 0 34px">${c.isAnswer?'<b style="color:var(--ok)">✓ Answer</b> ':''}${esc(c.body)}</p></div>`).join('') || '<p class="hint">No replies yet.</p>'}
      ${reply.ok && (!p.commentsLocked || mod) ? `<div class="row"><input type="text" id="r-${p.id}" placeholder="Write a reply"><button class="send" data-send="${p.id}">Reply</button></div>` : `<p class="lock">🔒 ${esc(p.commentsLocked?'Replies are closed on this post.':reply.why)}</p>`}</div>`:''}
  </article>`;
}
function renderMain(){
  const g=group(cur); if(!g){ $('#main').innerHTML='<div class="feed"><p class="hint">No groups for this person.</p></div>'; return; }
  const mod=isMod(g.id), r=role(g.id);
  const posts=DB.posts.filter(p=>p.groupId===g.id && p.status!=='removed' && p.status!=='rejected' && (p.status==='published' || mod || p.authorId===me))
    .sort((a,b)=> g.settings.mode==='chat' ? new Date(a.createdAt)-new Date(b.createdAt) : (b.pinned-a.pinned) || new Date(b.createdAt)-new Date(a.createdAt));
  const viewOk = can(g.id,'viewContent').ok;
  const pending = posts.filter(p=>p.status==='pending').length;
  const pp=can(g.id,'post'), aq=can(g.id,'askQuestion');
  const asQ = !pp.ok && aq.ok, c = asQ ? aq : pp, isChat=g.settings.mode==='chat';
  const members = DB.memberships.filter(m=>m.groupId===g.id).length;
  $('#main').innerHTML = `<div class="head"><div style="min-width:0">
      <h2>${g.icon} ${esc(g.name)}</h2><p>${esc(g.description)}</p>
      <div class="pills"><span class="pill">${MODE[g.settings.mode][0]}</span><span class="pill">${g.settings.visibility}</span><span class="pill">${members} people</span>
      <span class="pill">You: ${r}</span>${g.settings.locked?'<span class="pill bad">Locked</span>':''}${mod&&pending?`<span class="pill gold">${pending} to review</span>`:''}</div></div>
      ${isOwner(g.id)?'<button class="ghost" id="setbtn">Group settings</button>':''}</div>
    <div class="feed">${viewOk ? posts.map(p=>postHTML(p,g)).join('') || '<p class="hint">Nothing posted yet.</p>' : '<p class="lock">🔒 Only members can read this group.</p>'}</div>
    <div class="comp">${c.ok ? `
      ${isChat&&!asQ?'':`<input type="text" id="ct" placeholder="${asQ?'Your question, in a line':'Title'}">`}
      <div class="row"><textarea id="cb" rows="2" placeholder="${asQ?'Add any details':isChat?'Message '+esc(g.name):'Write a post'}"></textarea><button class="send" id="post">${asQ?'Ask':'Post'}</button></div>
      ${asQ && g.settings.allowAnonymousQuestions ? `<label class="tg" style="justify-content:flex-start"><input type="checkbox" id="anon" ${anon?'checked':''}> Ask anonymously</label>`:''}
      ${c.review?'<span class="note">A moderator reviews this before others can see it.</span>':''}`
      : `<p class="lock">🔒 ${esc(c.why)}</p>`}</div>`;
  const f=$('.feed'); if(isChat) f.scrollTop=f.scrollHeight;
}

    ${Object.keys(PERM_LABELS).map(k=>`<label class="perm" for="p-${k}"><span>${PERM_LABELS[k]}</span><select id="p-${k}" data-perm="${k}">${Object.keys(AUD).map(a=>`<option ${s.permissions[k]===a?'selected':''}>${a}</option>`).join('')}</select></label>`).join('')}</div>
  <div class="sec"><h3>Moderation</h3>${tg('requirePostApproval','Approve posts before they appear',s.requirePostApproval)}${tg('requireQuestionApproval','Approve questions before they appear',s.requireQuestionApproval)}
    ${tg('allowAnonymousQuestions','Allow anonymous questions',s.allowAnonymousQuestions)}${tg('quiet','Quiet hours for members, 9 PM to 7 AM',!!s.quietHours)}${tg('retainDeletedContent','Keep removed posts for admin records',s.retainDeletedContent)}
    <span class="lbl">Slow mode</span>${seg('slowModeSeconds',[0,30,60,300],s.slowModeSeconds,{0:'Off',30:'30 sec',60:'1 min',300:'5 min'})}
    <span class="lbl">Close replies after</span>${seg('autoCloseCommentsAfterDays',['null',7,14,30],String(s.autoCloseCommentsAfterDays),{null:'Never',7:'7 days',14:'14 days',30:'30 days'})}
    <span class="lbl">Language filter</span>${seg('contentFilter',['off','standard','strict'],s.contentFilter)}</div>
  <button class="send" id="save">${draftNew?'Create group':'Save settings'}</button>`;
}
function openSettings(){ const g=group(cur); draft=structuredClone(g); draftNew=false; renderDrawer(); }
function openNew(){
  draftNew=true;
  draft={name:'',description:'',icon:'💬',color:'#4B2A7B',roles:[],grades:[],guardians:false,settings:{mode:'chat',visibility:'private',joinPolicy:'assigned',permissions:{...PRESETS.chat},requirePostApproval:false,requireQuestionApproval:false,allowAnonymousQuestions:false,slowModeSeconds:0,autoCloseCommentsAfterDays:null,locked:false,quietHours:null,contentFilter:'standard',retainDeletedContent:true,membersCanLeave:false}};
  renderDrawer();
}
function matches(rule,u){
  if(rule.schoolRoles && !rule.schoolRoles.includes(u.schoolRole)) return false;
  if(rule.grades && !rule.grades.includes(u.grade)) return false; return true;
}
function saveDrawer(){
  if(draftNew){
    if(!draft.name.trim()){ toast('Give the group a name first.'); return; }
    const id='g-'+Date.now(), stu=draft.grades.length && !draft.roles.length ? ['student'] : draft.roles;
    const rule={id:'r-'+id, assignAs: draft.settings.mode==='broadcast'?'subscriber':'member'};
    if(stu.length) rule.schoolRoles=stu; if(draft.grades.length) rule.grades=draft.grades;
    const g={id,name:draft.name,description:draft.description,icon:{chat:'💬',forum:'🗂️',broadcast:'📣',qa:'❓'}[draft.settings.mode],color:'#4B2A7B',category:'class',settings:draft.settings,assignmentRules:(stu.length||draft.grades.length)?[rule]:[]};
    DB.groups.push(g); DB.memberships.push({groupId:id,userId:me,role:'owner',source:'manual'});
    let n=0;
    if(g.assignmentRules.length) DB.users.forEach(u=>{ if(u.id!==me && matches(rule,u)){ DB.memberships.push({groupId:id,userId:u.id,role:rule.assignAs,source:'rule'}); n++;
      if(draft.guardians) DB.users.filter(p=>(p.guardianOf||[]).includes(u.id)).forEach(p=>{ if(!mship(id,p.id)){ DB.memberships.push({groupId:id,userId:p.id,role:'subscriber',source:'rule'}); n++; }}); }});
    cur=id; toast(`Created. ${n} ${n===1?'person':'people'} added automatically.`);
  } else {
    Object.assign(group(cur), {settings: draft.settings}); toast(draft.settings.locked ? 'Saved. Group is locked.' : 'Settings saved.');
  }
  $('#drawer').hidden=true; render();
}

/* ---- events ---- */
document.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  const g=group(cur);
  if(t.dataset.g){ cur=t.dataset.g; openReplies.clear(); $('#drawer').hidden=true; render(); }
  else if(t.id==='newg') openNew();
  else if(t.id==='setbtn') openSettings();
  else if(t.id==='close') $('#drawer').hidden=true;
  else if(t.id==='save') saveDrawer();
  else if(t.dataset.rep){ openReplies.has(t.dataset.rep)?openReplies.delete(t.dataset.rep):openReplies.add(t.dataset.rep); renderMain(); }
  else if(t.dataset.like){ const p=DB.posts.find(x=>x.id===t.dataset.like); (p.reactions['👍'] ||= []); if(!p.reactions['👍'].includes(me)) p.reactions['👍'].push(me); renderMain(); }
  else if(t.dataset.up){ const p=DB.posts.find(x=>x.id===t.dataset.up); p.score++; renderMain(); }
  else if(t.dataset.vote){ const [pid,oid]=t.dataset.vote.split('|'); if(!can(cur,'react').ok){ toast(can(cur,'react').why); return; }
    const p=DB.posts.find(x=>x.id===pid); p.poll.options.forEach(o=>o.votes=o.votes.filter(v=>v!==me)); p.poll.options.find(o=>o.id===oid).votes.push(me); renderMain(); }
  else if(t.dataset.m){ const [a,pid]=t.dataset.m.split('|'), p=DB.posts.find(x=>x.id===pid);
    if(a==='approve') p.status='published'; if(a==='reject') p.status='rejected'; if(a==='remove') p.status='removed';
    if(a==='pin') p.pinned=!p.pinned; if(a==='lock') p.commentsLocked=!p.commentsLocked;
    toast({approve:'Approved and published.',reject:'Rejected. Only the author was notified.',remove:'Removed. Kept in the admin record.',pin:p.pinned?'Pinned.':'Unpinned.',lock:p.commentsLocked?'Replies closed.':'Replies reopened.'}[a]); renderMain(); }
  else if(t.dataset.send){ const inp=$('#r-'+t.dataset.send); if(!inp.value.trim()) return;
    DB.comments.push({id:'c-'+Date.now(),postId:t.dataset.send,parentCommentId:null,authorId:me,body:inp.value,status:'published',isAnswer:isMod(cur)&&group(cur).settings.mode==='qa',score:0,createdAt:NOW.toISOString()}); renderMain(); }
  else if(t.id==='post'){ const body=$('#cb').value.trim(), title=$('#ct')?.value.trim(); if(!body && !title) return;
    const asQ=!can(cur,'post').ok, d=asQ?can(cur,'askQuestion'):can(cur,'post');
    DB.posts.push({id:'p-'+Date.now(),groupId:cur,authorId:me,anonymous:asQ&&anon,kind:asQ?'question':g.settings.mode==='chat'?'message':'thread',title,body,attachments:[],status:d.review?'pending':'published',pinned:false,commentsLocked:false,score:0,reactions:{},createdAt:new Date().toISOString()});
    if(d.review) toast('Sent for review. It appears once a moderator approves it.'); renderMain(); }
  else if(t.closest('[data-seg]')){ const k=t.closest('[data-seg]').dataset.seg; let v=t.dataset.v;
    v = v==='null'?null : /^\d+$/.test(v)?Number(v):v;
    draft.settings[k]=v; if(k==='mode') draft.settings.permissions={...PRESETS[v]}; renderDrawer(); }
  else if(t.closest('[data-multi]')){ const k=t.closest('[data-multi]').dataset.multi, v=k==='grades'?Number(t.dataset.v):t.dataset.v;
    draft[k]=draft[k].includes(v)?draft[k].filter(x=>x!==v):[...draft[k],v]; renderDrawer(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='who'){ me=t.value; openReplies.clear(); $('#drawer').hidden=true; render(); toast('Now viewing as '+user(me).firstName+' ('+user(me).schoolRole+').'); }
  else if(t.id==='anon') anon=t.checked;
  else if(t.dataset.perm) draft.settings.permissions[t.dataset.perm]=t.value;
  else if(t.dataset.tg){ const k=t.dataset.tg;
    if(k==='quiet') draft.settings.quietHours=t.checked?{start:'21:00',end:'07:00',appliesTo:['member']}:null;
    else if(k==='guardians') draft.guardians=t.checked;
    else draft.settings[k]=t.checked;
    renderDrawer(); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='lockReason') draft.settings.lockReason=t.value;
  if(t.id==='ng-name') draft.name=t.value;
  if(t.id==='ng-desc') draft.description=t.value;
});
function render(){ renderWho(); renderRail(); renderMain(); }
render();
</script>
